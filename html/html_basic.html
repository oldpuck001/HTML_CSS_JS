<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html_basic</title>
</head>
<body>

    <!-- 標題 -->
    <h1>h1</h1>
    <h2>h2</h2>
    <h3>h3</h3>
    <h4>h4</h4>
    <h5>h5</h5>
    <h6>h6</h6>

    <!-- 段落 -->
    <p>段落</p>

    <!-- 文字格式 -->
    <p>一般文字</p>
    <p><b>粗體文字</b></p>
    <p><strong>強調文字</strong></p>
    <p><i>斜體文字</i></p>
    <p><em>em元素文字</em></p>

    <!-- 換行 -->
    <p>換行</p>
    <br>
    <p>換行</p>

    <!-- 這裡是註解 -->

    <!-- 空格的跳脫字元 -->
    <p>空&nbsp;格</p>
    <p>空&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;格</p>

    <!-- 商標的跳脫字元 -->
    <p>&trade;商標的跳脫字元</p>

    <!-- 版權的跳脫字元 -->
    <p>&copy;版權的跳脫字元</p>

</body>
</html>
