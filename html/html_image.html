<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html_image</title>
</head>
<body>
    
    <br><br><br>

    <!-- 显示图片，為了保持圖片比例，height或width通常只設置一個 -->
    <img src="./shinkansen.jpeg" width="400" alt="這裡是圖片沒有顯示出來時的文字">
    <br>
    <img src="./train.jpg" height="300" alt="這裡圖片沒有顯示出來時的文字">

    <br><br><br>

    <!-- 给图片加上链接 -->
    <a href="https://www.apple.com/">
        <img src="./shinkansen.jpeg" height="300" alt="这是没有找到图片时的信息">
    </a>

</body>
</html>
