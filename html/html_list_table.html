<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index_list_table</title>
</head>
<body>

    <br><br><br>
    
    <!-- 無序列表 ul-->
    <ul>
        <li>無序列表1</li>
        <li>無序列表2</li>
        <li>無序列表3</li>
    </ul>

    <!-- 有序列表 ol-->
    <ol>
        <li>無序列表1</li>
        <li>無序列表2</li>
        <li>無序列表3</li>
    </ol>

    <br><br><br>

    <!-- 表格 -->
    <table>
        <tr>
            <th>表格列標題1</th>
            <th>表格列標題2</th>
            <th>表格列標題3</th>
        </tr>
        <tr>
            <td>表格列1行1</td>
            <td>表格列2行1</td>
            <td>表格列3行1</td>
        </tr>
        <tr>
            <td>表格列1行2</th>
            <td>表格列2行2</th>
            <td>表格列3行2</th>
        </tr>
    </table>

</body>
</html>
